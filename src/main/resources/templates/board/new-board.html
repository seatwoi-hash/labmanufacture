<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <title>Создание нового устройства</title>
    <style>
        .form-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #1d7acc;
        }

        .form-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #1d7acc;
        }

        .form-section h5 {
            color: #1d7acc;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .required-field::after {
            content: " *";
            color: #dc3545;
        }

        .btn-submit {
            background: linear-gradient(135deg, #1d7acc, #1669b8);
            border: none;
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(29, 122, 204, 0.3);
        }

        .form-control:focus {
            border-color: #1d7acc;
            box-shadow: 0 0 0 0.2rem rgba(29, 122, 204, 0.25);
        }

        .form-select:focus {
            border-color: #1d7acc;
            box-shadow: 0 0 0 0.2rem rgba(29, 122, 204, 0.25);
        }

        .form-section .form-control,
        .form-section .form-select {
            width: 100%;
            min-width: 300px;
        }

        .form-text {
            white-space: nowrap;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .form-fields-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

    </style>

</head>
<body>
<!-- Включаем фрагменты -->
<div th:replace="fragments :: home-button"></div>
<div th:replace="fragments :: user-menu"></div>
<div th:replace="fragments :: sidebar"></div>

<!-- Основной контент -->
<div class="main-content">
    <div class="form-container">
        <div class="form-header">
            <h1><i class="fas fa-microchip me-2"></i>Создание новой платы
            </h1>


            <p class="text-muted">Заполните информацию о новой плате</p>
        </div>

        <form th:action="@{/device/create-board}" th:object="${device}" method="post" id="deviceForm">

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Блок для отображения ошибок полей -->
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <div th:each="err : ${#fields.errors('*')}" th:text="${err}"></div>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <!-- Основная информация -->
            <div class="form-section">
                <h5><i class="fas fa-info-circle me-2"></i>Основная информация</h5>


                <div class="form-fields-container">
                    <div>
                        <label for="serialNumber"
                               class="form-label required-field"
                               style="text-align: left; display: block;"> Серийный номер</label>
                        <input type="text"
                               class="form-control"
                               id="serialNumber"
                               th:field="*{serialNumber}"
                               required
                               maxlength="100"
                               placeholder="Введите серийный номер"
                               onkeydown="return event.key !== 'Enter';"
                               autocomplete="off">
                        <div class="form-text">Уникальный идентификатор устройства</div>
                    </div>

                    <div>
                        <label for="subType"
                               class="form-label required-field"
                               style="text-align: left; display: block;">Тип платы</label>
                        <select class="form-select"
                                id="subType"
                                th:field="*{subType}"
                                required>
                            <option value="" disabled selected>Выберите тип</option>
                            <option th:each="subtypeItem : ${subtypeList}"
                                    th:value="${subtypeItem.id}"
                                    th:text="${subtypeItem.name}">
                            </option>
                        </select>
                        <div class="form-text">Выберите тип платы из списка</div>
                    </div>
                </div>
            </div> <!-- Закрываем form-section здесь -->


            <!-- Кнопки действий -->
                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/static}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Назад
                    </a>

                    <div>
                        <button type="reset" class="btn btn-outline-danger me-2">
                            <i class="fas fa-undo me-2"></i>Очистить
                        </button>
                        <button type="submit" class="btn btn-submit">
                            <i class="fas fa-save me-2"></i>Создать устройство
                        </button>
                    </div>
                </div>
        </form>
    </div>
</div>

<!-- Общие скрипты -->
<div th:replace="fragments :: scripts"></div>

<!-- Специфичные скрипты для этой страницы -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Счетчик символов для описания
        const descriptionTextarea = document.getElementById('description');
        const charCount = document.getElementById('charCount');

        if (descriptionTextarea && charCount) {
            descriptionTextarea.addEventListener('input', function () {
                charCount.textContent = this.value.length;
            });
            charCount.textContent = descriptionTextarea.value.length;
        }

        // Валидация формы
        const deviceForm = document.getElementById('deviceForm');
        if (deviceForm) {
            deviceForm.addEventListener('submit', function (e) {
                const serialNumber = document.getElementById('serialNumber').value.trim();
                if (!serialNumber) {
                    e.preventDefault();
                    alert('Пожалуйста, заполните все обязательные поля (отмечены *)');
                    return false;
                }
            });
        }
    });
    const deviceForm = document.getElementById('deviceForm');
    if (deviceForm) {
        deviceForm.addEventListener('submit', function (e) {
            const serialNumber = document.getElementById('serialNumber').value.trim();
            const subtype = document.getElementById('subtype').value;

            if (!serialNumber || !subtype) {
                e.preventDefault();
                alert('Пожалуйста, заполните все обязательные поля (отмечены *)');
                return false;
            }
        });
    }
</script>
</body>
</html>
