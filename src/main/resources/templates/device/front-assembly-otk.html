<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОТК передней части моноблока</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <style>

        .btn-passed {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #28a745;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-failed {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #dc3545;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-passed:hover {
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
            transform: translateY(-2px);
        }

        .btn-failed:hover {
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
            transform: translateY(-2px);
        }

        .confirm-modal.modal-passed .modal-header {
            background: #28a745;
        }

        .confirm-modal.modal-failed .modal-header {
            background: #dc3545;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments :: home-button}"></div>
<div th:replace="~{fragments :: sidebar}"></div>
<div th:replace="~{fragments :: user-menu}"></div>

<div class="main-content">
    <header class="page-header">
        <div class="header-content">
            <h1><i class="fas fa-cube me-2"></i>ОТК передней части моноблока</h1>
            <div class="header-actions">
                <span class="badge bg-primary fs-6 mb-3">
                    Сборок: <span th:text="${operations.size()}">0</span>
                </span>
            </div>
        </div>
    </header>

    <main class="page-content">
        <div class="container-fluid">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="search-container">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="position-relative">
                            <input id="searchInput"
                                   type="text"
                                   class="form-control search-input"
                                   placeholder="Поиск по ID корпуса или SN платы...">
                            <i class="fas fa-search search-icon"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div id="assemblyTableContainer">
                <div class="device-table" th:if="${not operations.empty}">
                    <div class="table-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4 class="mb-1">Сборки для ОТК</h4>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-light text-dark fs-6">
                                    <i class="fas fa-list me-1"></i>
                                    <span th:text="${operations.size()}">0</span> сборок
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="assemblyTable">
                            <thead>
                            <tr>
                                <th>ID корпуса</th>
                                <th>SN материнской платы</th>
                                <th>SN платы клавиатуры</th>
                                <th>Дата создания</th>
                                <th class="text-center">Действия</th>
                                <th class="text-center">Файл</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="operation : ${operations}" th:with="assembly=${operation.frontAssembly}">
                                <td>
                                    <span class="device-sn" th:text="${assembly.caseId}"></span>
                                    <br><small class="text-muted" th:text="${operation.status.description}"></small>
                                </td>
                                <td th:text="${assembly.motherboardSerialNumber}"></td>
                                <td th:text="${assembly.keyboardBoardSerialNumber}"></td>
                                <td th:text="${#temporals.format(assembly.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                                <td>
                                    <div class="action-buttons">
                                        <button type="button" class="btn btn-passed otk-transition-btn"
                                                th:data-assembly-id="${assembly.id}" data-action="passed"
                                                data-title="Подтверждение прохождения ОТК"
                                                data-message="Сборка будет передана на следующий этап">Пройдено</button>
                                        <button type="button" class="btn btn-failed otk-transition-btn"
                                                th:data-assembly-id="${assembly.id}" data-action="failed"
                                                data-title="Подтверждение отклонения ОТК"
                                                data-message="Сборка будет передана в ремонт">Не пройдено</button>
                                    </div>
                                </td>
                                <td class="text-center">
                                    <a th:if="${assembly.fileUrl != null}"
                                       th:href="${assembly.fileUrl}"
                                       class="text-success"
                                       target="_blank"
                                       title="Открыть файл">
                                        <i class="fas fa-cloud-download-alt fa-lg"></i>
                                    </a>
                                    <span th:unless="${assembly.fileUrl != null}" class="text-muted">
                                        <i class="fas fa-times-circle fa-lg" title="Файл не загружен"></i>
                                    </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="empty-state" th:if="${operations.empty}">
                    <i class="fas fa-inbox"></i>
                    <h4>Нет сборок для ОТК</h4>
                    <p class="text-muted">Сборки появятся после завершения этапа создания</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade confirm-modal" id="otkTransitionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="otkTransitionForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="modal-header">
                    <h5 class="modal-title" id="otkTransitionTitle"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <p id="otkTransitionMessage" class="mb-3"></p>
                    <label for="otkTransitionDescription" class="form-label">
                        Комментарий<span id="otkRequiredMark" class="text-danger"> *</span>:
                    </label>
                    <textarea id="otkTransitionDescription" name="description" class="form-control" rows="3"
                              placeholder="Добавьте комментарий при необходимости..."></textarea>
                    <div class="invalid-feedback">Комментарий обязателен для этого действия.</div>
                    <input id="otkTransitionAction" type="hidden" name="action">
                    <input type="hidden" name="returnTo" value="otk">
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times me-2"></i>Отмена</button>
                    <button id="otkTransitionConfirmButton" type="submit" class="btn btn-primary"><i class="fas fa-check me-2"></i>Подтвердить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script>
    document.getElementById('searchInput').addEventListener('input', function () {
        const query = this.value.trim().toLowerCase();
        document.querySelectorAll('#assemblyTable tbody tr').forEach(row => {
            row.hidden = !row.textContent.toLowerCase().includes(query);
        });
    });

    const otkTransitionModal = new bootstrap.Modal(document.getElementById('otkTransitionModal'));
    document.querySelectorAll('.otk-transition-btn').forEach(button => {
        button.addEventListener('click', () => {
            const modalElement = document.getElementById('otkTransitionModal');
            const passed = button.dataset.action === 'passed';
            modalElement.classList.toggle('modal-passed', passed);
            modalElement.classList.toggle('modal-failed', !passed);
            const confirmButton = document.getElementById('otkTransitionConfirmButton');
            confirmButton.classList.remove('btn-primary', 'btn-success', 'btn-danger');
            confirmButton.classList.add(passed ? 'btn-success' : 'btn-danger');
            document.getElementById('otkTransitionForm').action =
                '/device/front-assembly/' + button.dataset.assemblyId + '/transition';
            document.getElementById('otkTransitionAction').value = button.dataset.action;
            document.getElementById('otkTransitionTitle').textContent = button.dataset.title;
            document.getElementById('otkTransitionMessage').textContent = button.dataset.message;
            document.getElementById('otkTransitionDescription').value = '';
            const description = document.getElementById('otkTransitionDescription');
            description.required = !passed;
            description.placeholder = passed
                ? 'Добавьте комментарий при необходимости...'
                : 'Укажите комментарий...';
            document.getElementById('otkRequiredMark').hidden = passed;
            otkTransitionModal.show();
        });
    });
</script>
</body>
</html>
