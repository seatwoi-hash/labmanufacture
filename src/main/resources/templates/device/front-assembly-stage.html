<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Этап сборки</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <style>
        .btn-repair {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #8d4d4d;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-test {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #e72534;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-repair:hover {
            color: white;
            box-shadow: 0 4px 8px rgb(201, 106, 106);
            transform: translateY(-2px);
        }

        .btn-test:hover {
            color: white;
            box-shadow: 0 4px 8px rgba(243, 44, 62, 0.3);
            transform: translateY(-2px);
        }

        .confirm-modal.modal-passed .modal-header {
            background: #28a745;
        }

        .confirm-modal.modal-failed .modal-header,
        .confirm-modal.modal-test .modal-header {
            background: #f32020;
        }

        .confirm-modal.modal-repair .modal-header {
            background: #8d3f3f;
        }

    </style>
</head>
<body>
<div th:replace="~{fragments :: home-button}"></div>
<div th:replace="~{fragments :: sidebar}"></div>
<div th:replace="~{fragments :: user-menu}"></div>

<div class="main-content">
    <header class="page-header">
        <div class="header-content">
            <h1><i class="fas fa-cube me-2"></i><span th:text="${pageTitle}">Этап сборки</span></h1>
            <div class="header-actions">
                <span class="badge bg-primary fs-6 mb-3">
                    Сборок: <span th:text="${operations.size()}">0</span>
                </span>
            </div>
        </div>
    </header>

    <main class="page-content">
        <div class="container-fluid">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="search-container">
                <div class="position-relative">
                    <input id="searchInput"
                           type="text"
                           class="form-control search-input"
                           placeholder="Поиск по ID корпуса или SN платы...">
                    <i class="fas fa-search search-icon"></i>
                </div>
            </div>

            <div class="device-table" th:if="${not operations.empty}">
                <div class="table-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0" th:text="${tableTitle}">Сборки</h4>
                        <span class="badge bg-light text-dark fs-6">
                            <i class="fas fa-list me-1"></i>
                            <span th:text="${operations.size()}">0</span> сборок
                        </span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="assemblyTable">
                        <thead>
                        <tr>
                            <th>ID корпуса</th>
                            <th>SN материнской платы</th>
                            <th>SN платы клавиатуры</th>
                            <th>Дата создания</th>
                            <th>Статус</th>
                            <th class="text-center" th:if="${stage != 'ready'}">Действия</th>
                            <th class="text-center">Файл</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="operation : ${operations}" th:with="assembly=${operation.frontAssembly}">
                            <td>
                                <a th:if="${stage == 'ready'}"
                                   th:href="@{/device/front-assembly/{id}/operations(id=${assembly.id})}"
                                   style="text-decoration: none; color: inherit;"
                                   title="Все операции сборки">
                                    <span class="device-sn" th:text="${assembly.caseId}"></span>
                                </a>
                                <span th:unless="${stage == 'ready'}" class="device-sn"
                                      th:text="${assembly.caseId}"></span>
                            </td>
                            <td th:text="${assembly.motherboardSerialNumber}"></td>
                            <td th:text="${assembly.keyboardBoardSerialNumber}"></td>
                            <td th:text="${#temporals.format(assembly.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                            <td th:text="${operation.status.description}"></td>
                            <td th:if="${stage != 'ready'}">
                                <button th:if="${stage == 'repair'}" class="btn btn-success transition-btn" type="button"
                                        th:data-assembly-id="${assembly.id}" data-action="complete" data-return-to="repair"
                                        data-title="Подтверждение завершения ремонта"
                                        data-message="Сборка будет передана на ОТК">Ремонт завершён</button>
                                <div th:if="${stage == 'testing'}" class="d-flex gap-2">
                                    <button class="btn btn-success transition-btn" type="button" th:data-assembly-id="${assembly.id}" data-action="passed" data-return-to="testing" data-title="Подтверждение результата тестирования" data-message="Сборка будет отмечена как прошедшая тестирование">Пройдено</button>
                                    <button class="btn btn-danger transition-btn" type="button" th:data-assembly-id="${assembly.id}" data-action="failed" data-return-to="testing" data-title="Подтверждение результата тестирования" data-message="Сборка будет передана на диагностику">Не пройдено</button>
                                </div>
                                <div th:if="${stage == 'diagnostics'}" class="d-flex gap-2">
                                    <button class="btn btn-test transition-btn" type="button" th:data-assembly-id="${assembly.id}" data-action="test" data-return-to="diagnostics" data-title="Подтверждение отправки на тест" data-message="Сборка будет передана на тестирование №2">Тест</button>
                                    <button class="btn btn-repair transition-btn" type="button" th:data-assembly-id="${assembly.id}" data-action="repair" data-return-to="diagnostics" data-title="Подтверждение отправки в ремонт" data-message="Сборка будет передана в ремонт №2">Ремонт</button>
                                </div>
                            </td>
                            <td class="text-center">
                                <a th:if="${assembly.fileUrl != null}"
                                   th:href="${assembly.fileUrl}"
                                   class="text-success"
                                   target="_blank">
                                    <i class="fas fa-cloud-download-alt fa-lg"></i>
                                </a>
                                <span th:unless="${assembly.fileUrl != null}" class="text-muted">
                                    <i class="fas fa-times-circle fa-lg" title="Файл не загружен"></i>
                                </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="empty-state" th:if="${operations.empty}">
                <i class="fas fa-inbox"></i>
                <h4 th:text="${emptyMessage}">Сборок пока нет</h4>
                <p class="text-muted">Сборки появятся после перехода на этот этап</p>
            </div>
        </div>
    </main>
</div>

<div class="modal fade confirm-modal" id="transitionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="transitionForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="modal-header">
                    <h5 class="modal-title" id="transitionModalTitle"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <p id="transitionModalMessage" class="mb-3"></p>
                    <label for="transitionDescription" class="form-label">
                        Комментарий<span id="transitionRequiredMark" class="text-danger"> *</span>:
                    </label>
                    <textarea id="transitionDescription" name="description" class="form-control" rows="3"
                              placeholder="Добавьте комментарий при необходимости..."></textarea>
                    <div class="invalid-feedback">Комментарий обязателен для этого действия.</div>
                    <input id="transitionAction" type="hidden" name="action">
                    <input id="transitionReturnTo" type="hidden" name="returnTo">
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>Отмена
                    </button>
                    <button id="transitionConfirmButton" type="submit" class="btn btn-primary">
                        <i class="fas fa-check me-2"></i>Подтвердить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script>
    document.getElementById('searchInput').addEventListener('input', function () {
        const query = this.value.trim().toLowerCase();
        document.querySelectorAll('#assemblyTable tbody tr').forEach(row => {
            row.hidden = !row.textContent.toLowerCase().includes(query);
        });
    });

    const transitionModal = new bootstrap.Modal(document.getElementById('transitionModal'));
    document.querySelectorAll('.transition-btn').forEach(button => {
        button.addEventListener('click', () => {
            const modalElement = document.getElementById('transitionModal');
            modalElement.classList.remove('modal-passed', 'modal-failed', 'modal-test', 'modal-repair');
            const modalClass = button.dataset.action === 'repair' ? 'modal-repair'
                : button.dataset.action === 'test' ? 'modal-test'
                    : button.dataset.action === 'failed' ? 'modal-failed' : 'modal-passed';
            modalElement.classList.add(modalClass);
            const confirmButton = document.getElementById('transitionConfirmButton');
            confirmButton.classList.remove('btn-primary', 'btn-success', 'btn-danger');
            confirmButton.classList.add(modalClass === 'modal-passed' ? 'btn-success' : 'btn-danger');
            document.getElementById('transitionForm').action =
                '/device/front-assembly/' + button.dataset.assemblyId + '/transition';
            document.getElementById('transitionAction').value = button.dataset.action;
            document.getElementById('transitionReturnTo').value = button.dataset.returnTo;
            document.getElementById('transitionModalTitle').textContent = button.dataset.title;
            document.getElementById('transitionModalMessage').textContent = button.dataset.message;
            document.getElementById('transitionDescription').value = '';
            const description = document.getElementById('transitionDescription');
            const commentRequired = button.dataset.action !== 'passed';
            description.required = commentRequired;
            description.placeholder = commentRequired
                ? 'Укажите комментарий...'
                : 'Добавьте комментарий при необходимости...';
            document.getElementById('transitionRequiredMark').hidden = !commentRequired;
            transitionModal.show();
        });
    });
</script>
</body>
</html>
