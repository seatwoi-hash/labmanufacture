<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование типа передней части моноблока</title>
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .home-button {
            position: fixed !important;
            bottom: 30px !important;
            right: 30px !important;
            width: 60px !important;
            height: 60px !important;
            border-radius: 50% !important;
            background-color: #1E40AF !important;
            color: white !important;
            border: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 24px !important;
            cursor: pointer !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
            z-index: 1000 !important;
            transition: all 0.3s ease !important;
        }

        .home-button:hover {
            background-color: #1e3a8a !important;
            transform: scale(1.1) !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25) !important;
        }

        .home-button:active {
            transform: scale(0.95) !important;
        }

        .edit-type-container {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header h2 {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .edit-form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 1.5rem 2rem;
        }

        .form-body {
            padding: 1.5rem 2rem;
            background: white;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: flex-end;
        }

        .btn-save {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 6px;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            .edit-type-container { padding: 1rem; }
            .form-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
<button class="home-button" type="button" onclick="window.location.href='/'" aria-label="На главную">
    <i class="fas fa-home"></i>
</button>

<main class="main-content">
    <div class="edit-type-container">
        <div class="page-header">
            <h2><i class="fas fa-cube"></i> Редактирование типа передней части моноблока</h2>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}">Ошибка при обновлении типа</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="edit-form-card">
            <div class="form-header">
                <h4 class="mb-0"><i class="fas fa-edit"></i> Форма редактирования</h4>
            </div>

            <div class="form-body">

            <form class="row g-4"
                  method="post"
                  th:action="@{/device/front-assembly/type/edit/{id}(id=${editingType.id})}"
                  th:object="${frontAssemblyType}"
                  enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="_method" value="PATCH">

                <div th:if="${#fields.hasAnyErrors()}" class="col-12 alert alert-danger mb-0">
                    <div th:each="fieldError : ${#fields.allErrors()}" th:text="${fieldError}"></div>
                </div>

                <div class="col-md-6">
                    <label for="typeName" class="form-label required-field">
                        <i class="fas fa-tag me-1"></i>Имя
                    </label>
                    <input id="typeName" class="form-control" type="text" th:field="*{name}" required>
                </div>

                <div class="col-md-6">
                    <label for="typeDescription" class="form-label required-field">
                        <i class="fas fa-align-left me-1"></i>Описание
                    </label>
                    <input id="typeDescription" class="form-control" type="text" th:field="*{description}" required>
                </div>

                <div class="col-md-6">
                    <label for="motherboardType" class="form-label required-field">
                        <i class="fas fa-microchip me-1"></i>Плата материнская
                    </label>
                    <select id="motherboardType" class="form-select" th:field="*{motherboardTypeId}" required>
                        <option value="" disabled>Выберите тип платы</option>
                        <option th:each="subtype : ${subtypeList}"
                                th:value="${subtype.id}"
                                th:text="${subtype.name}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="keyboardBoardType" class="form-label required-field">
                        <i class="fas fa-keyboard me-1"></i>Плата клавиатуры
                    </label>
                    <select id="keyboardBoardType" class="form-select" th:field="*{keyboardBoardTypeId}" required>
                        <option value="" disabled>Выберите тип платы</option>
                        <option th:each="subtype : ${subtypeList}"
                                th:value="${subtype.id}"
                                th:text="${subtype.name}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="assemblyInstruction" class="form-label">
                        <i class="fas fa-file-pdf me-1"></i>Инструкция сборки передней части
                    </label>
                    <input id="assemblyInstruction" name="assemblyInstruction" class="form-control"
                           type="file" accept="application/pdf,.pdf">
                    <div class="form-text"
                         th:text="${editingType.assemblyInstruction != null ? 'Текущий файл: ' + editingType.assemblyInstructionFileName + '. Выберите новый PDF для замены' : 'Файл не загружен. Можно добавить PDF'}"></div>
                </div>

                <div class="col-md-6">
                    <label for="assemblyDiagram" class="form-label">
                        <i class="fas fa-file-pdf me-1"></i>Сборочная схема
                    </label>
                    <input id="assemblyDiagram" name="assemblyDiagram" class="form-control"
                           type="file" accept="application/pdf,.pdf">
                    <div class="form-text"
                         th:text="${editingType.assemblyDiagram != null ? 'Текущий файл: ' + editingType.assemblyDiagramFileName + '. Выберите новый PDF для замены' : 'Файл не загружен. Можно добавить PDF'}"></div>
                </div>

                <div class="col-12 form-actions">
                    <button type="button" class="btn btn-cancel"
                            onclick="window.location.href='/device/front-assembly/type'">
                        <i class="fas fa-times"></i> Отмена
                    </button>
                    <button type="submit" class="btn btn-save">
                        <i class="fas fa-save"></i> Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
