    <script>
        (function restoreSidebarState() {
            const sidebar = document.getElementById('sideButtons');
            if (!sidebar) return;

            sidebar.querySelectorAll('.section-header').forEach(function (header, index) {
                const sectionName = header.getAttribute('data-section') || 'section-' + index;
                const expanded = localStorage.getItem('sidebar-section-' + sectionName) === 'true';
                const content = header.nextElementSibling;
                const arrow = header.querySelector('.section-arrow');

                content.classList.toggle('active', expanded);
                arrow.classList.toggle('rotated', expanded);
            });

            sidebar.querySelectorAll('.side-subsection-toggle').forEach(function (toggle) {
                const subsectionName = toggle.getAttribute('data-subsection');
                const expanded = localStorage.getItem('sidebar-subsection-' + subsectionName) === 'true';
                const content = toggle.nextElementSibling;
                const arrow = toggle.querySelector('.subsection-arrow');

                content.classList.toggle('active', expanded);
                arrow.classList.toggle('rotated', expanded);
                toggle.setAttribute('aria-expanded', expanded);
            });

            sidebar.classList.add('sidebar-state-ready');
        })();
    </script>

<div th:fragment="scripts">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/session-timeout.js}"></script>

    <script th:inline="javascript">
        function initializeCommonFeatures() {
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl)
            })

            document.addEventListener('click', function(event) {
                const userButton = document.getElementById('userDropdownButton');
                const dropdownMenu = document.querySelector('.dropdown-menu-user');

                if (userButton && dropdownMenu && !userButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
                    const openDropdown = bootstrap.Dropdown.getInstance(userButton);
                    if (openDropdown) {
                        openDropdown.hide();
                    }
                }
            });

            const menuToggle = document.getElementById('menuToggle');
            const sideButtons = document.getElementById('sideButtons');

            if (menuToggle && sideButtons) {
                menuToggle.addEventListener('click', function () {
                    sideButtons.classList.toggle('active');
                });

                document.addEventListener('click', function (event) {
                    if (window.innerWidth <= 992) {
                        if (!sideButtons.contains(event.target) && !menuToggle.contains(event.target) && sideButtons.classList.contains('active')) {
                            sideButtons.classList.remove('active');
                        }
                    }
                });


                const sectionHeaders = document.querySelectorAll('.section-header');

                function shouldExpandSection(sectionName) {
                    return localStorage.getItem('sidebar-section-' + sectionName) === 'true';
                }

                sectionHeaders.forEach(header => {
                    const sectionContent = header.nextElementSibling;
                    const arrow = header.querySelector('.section-arrow');
                    const sectionName = header.getAttribute('data-section') || 'section-' + Array.from(sectionHeaders).indexOf(header);

                    const shouldExpand = shouldExpandSection(sectionName);

                    if (shouldExpand) {
                        sectionContent.classList.add('active');
                        arrow.classList.add('rotated');
                    } else {
                        sectionContent.classList.remove('active');
                        arrow.classList.remove('rotated');
                    }

                    header.addEventListener('click', function () {
                        const currentSectionContent = this.nextElementSibling;
                        const currentArrow = this.querySelector('.section-arrow');
                        const currentSectionName = this.getAttribute('data-section') || 'section-' + Array.from(sectionHeaders).indexOf(this);

                        currentSectionContent.classList.toggle('active');
                        currentArrow.classList.toggle('rotated');

                        const isCurrentlyExpanded = currentSectionContent.classList.contains('active');
                        localStorage.setItem('sidebar-section-' + currentSectionName, isCurrentlyExpanded);
                    });
                });

                document.querySelectorAll('.side-subsection-toggle').forEach(toggle => {
                    const subsectionName = toggle.getAttribute('data-subsection');
                    const subsectionContent = toggle.nextElementSibling;
                    const subsectionArrow = toggle.querySelector('.subsection-arrow');
                    const storageKey = 'sidebar-subsection-' + subsectionName;
                    const isExpanded = localStorage.getItem(storageKey) === 'true';

                    subsectionContent.classList.toggle('active', isExpanded);
                    subsectionArrow.classList.toggle('rotated', isExpanded);
                    toggle.setAttribute('aria-expanded', isExpanded);

                    toggle.addEventListener('click', function () {
                        const expanded = subsectionContent.classList.toggle('active');
                        subsectionArrow.classList.toggle('rotated', expanded);
                        this.setAttribute('aria-expanded', expanded);
                        localStorage.setItem(storageKey, expanded);
                    });
                });

            }}




        document.addEventListener('DOMContentLoaded', function() {
            initializeCommonFeatures();
        });

    </script>
