<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Общие стили -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>


<div th:fragment="home-button">
    <!-- Кнопка "Домой" в правом нижнем углу -->
    <button class="home-button" onclick="window.location.href='/'">
        <i class="fas fa-home"></i>
    </button>
</div>

<!-- Фрагмент меню пользователя -->
<div th:fragment="user-menu">
    <div class="user-menu">
        <button class="user-button" type="button" id="userDropdownButton" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-user"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-user" aria-labelledby="userDropdownButton">
            <li>
                <div class="user-dropdown-header">
                    <div class="avatar-circle" style="background-color: #3e68ea; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-right: 12px;">
                        <span th:text="${currentUser.firstName != null ? currentUser.firstName.substring(0,1) : 'U'}"></span>
                        <span th:text="${currentUser.lastName != null ? currentUser.lastName.substring(0,1) : 'S'}"></span>
                    </div>
                    <div class="user-dropdown-info">
                        <h6 th:text="${currentUser.firstName}"></h6>
                        <p th:text="${currentUser.roles[0].getDescription()}"></p>
                    </div>
                </div>
            </li>
            <li><a class="dropdown-item-user" href="/editing-user"><i class="fas fa-user"></i> Мой профиль</a></li>
            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a class="dropdown-item-user" href="/add-user">
                    <i class="fas fa-cog"></i> Добавить пользователя
                </a>
            </li>
            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a class="dropdown-item-user" href="/employee"><i class="fas fa-circle-user"></i> Редактирование сотрудников</a>
            </li>
            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a class="dropdown-item-user" href="/devicetype/add"><i class="fa-solid fa-bacon"></i> Тип платы</a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="dropdown-item-user text-danger" style="border: none; background: none; width: 100%; text-align: left;">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                </form>
            </li>
        </ul>
    </div>
</div>

<div th:fragment="scripts">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <script th:inline="javascript">
        function initializeCommonFeatures() {
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl)
            })

            document.addEventListener('click', function(event) {
                const userButton = document.getElementById('userDropdownButton');
                const dropdownMenu = document.querySelector('.dropdown-menu-user');

                if (userButton && dropdownMenu && !userButton.contains(event.target) && !dropdownMenu.contains(event.target)) {
                    const openDropdown = bootstrap.Dropdown.getInstance(userButton);
                    if (openDropdown) {
                        openDropdown.hide();
                    }
                }
            });

            const menuToggle = document.getElementById('menuToggle');
            const sideButtons = document.getElementById('sideButtons');

            if (menuToggle && sideButtons) {
                menuToggle.addEventListener('click', function () {
                    sideButtons.classList.toggle('active');
                });

                document.addEventListener('click', function (event) {
                    if (window.innerWidth <= 992) {
                        if (!sideButtons.contains(event.target) && !menuToggle.contains(event.target) && sideButtons.classList.contains('active')) {
                            sideButtons.classList.remove('active');
                        }
                    }
                });


                const sectionHeaders = document.querySelectorAll('.section-header');

                function shouldExpandSection(sectionName, hasSavedState) {
                    if (hasSavedState) {
                        const savedState = localStorage.getItem('sidebar-section-' + sectionName);
                        return savedState === 'true';
                    }
                    const header = document.querySelector(`[data-section="${sectionName}"]`);
                    if (!header) return false;

                    const sectionContent = header.nextElementSibling;
                    const arrow = header.querySelector('.section-arrow');

                    return sectionContent.classList.contains('active') || arrow.classList.contains('rotated');
                }

                sectionHeaders.forEach(header => {
                    const sectionContent = header.nextElementSibling;
                    const arrow = header.querySelector('.section-arrow');
                    const sectionName = header.getAttribute('data-section') || 'section-' + Array.from(sectionHeaders).indexOf(header);

                    const hasSavedState = localStorage.getItem('sidebar-section-' + sectionName) !== null;

                    const shouldExpand = shouldExpandSection(sectionName, hasSavedState);

                    if (shouldExpand) {
                        sectionContent.classList.add('active');
                        arrow.classList.add('rotated');
                    } else {
                        sectionContent.classList.remove('active');
                        arrow.classList.remove('rotated');
                    }

                    if (!hasSavedState) {
                        const isCurrentlyExpanded = sectionContent.classList.contains('active');
                        localStorage.setItem('sidebar-section-' + sectionName, isCurrentlyExpanded);
                    }

                    header.addEventListener('click', function () {
                        const currentSectionContent = this.nextElementSibling;
                        const currentArrow = this.querySelector('.section-arrow');
                        const currentSectionName = this.getAttribute('data-section') || 'section-' + Array.from(sectionHeaders).indexOf(this);

                        currentSectionContent.classList.toggle('active');
                        currentArrow.classList.toggle('rotated');

                        const isCurrentlyExpanded = currentSectionContent.classList.contains('active');
                        localStorage.setItem('sidebar-section-' + currentSectionName, isCurrentlyExpanded);
                    });
                });

            }}




        document.addEventListener('DOMContentLoaded', function() {
            initializeCommonFeatures();
        });

    </script>
</div>

</html>
