<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <title>Страница не найдена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .error-container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #1d7acc, #0a58ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -4px;
        }

        .error-icon {
            font-size: 4rem;
            color: #dee2e6;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.75rem;
        }

        .error-description {
            font-size: 1.1rem;
            color: #718096;
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        .error-sub-description {
            font-size: 0.95rem;
            color: #a0aec0;
            margin-bottom: 2rem;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(135deg, #1d7acc, #0a58ca);
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #1d7acc, #0a58ca);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 122, 204, 0.3);
            cursor: pointer;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(29, 122, 204, 0.4);
            color: white;
            background: linear-gradient(135deg, #1669b8, #094a9e);
        }

        .btn-home i {
            font-size: 1.2rem;
        }

        .suggestions {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .suggestion-link {
            color: #1d7acc;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .suggestion-link:hover {
            color: #0a58ca;
            text-decoration: underline;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 16px;
            background: #fed7d7;
            color: #c53030;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 576px) {
            .error-container {
                padding: 2rem 1.5rem;
            }

            .error-code {
                font-size: 5.5rem;
            }

            .error-title {
                font-size: 1.4rem;
            }

            .btn-home {
                padding: 12px 28px;
                font-size: 1rem;
                width: 100%;
                justify-content: center;
            }

            .suggestions {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="error-container">
    <!-- Иконка -->
    <div class="error-icon">
        <i class="fas fa-map-signs"></i>
    </div>

    <!-- Код ошибки -->
    <div class="error-code">404</div>


    <!-- Заголовок -->
    <h1 class="error-title">Упс! Страница потерялась</h1>


    <!-- Разделитель -->
    <div class="divider"></div>

    <!-- Кнопка на главную -->
    <a th:href="@{/main}" class="btn-home">
        <i class="fas fa-home"></i>
        Вернуться на главную
    </a>

</div>

</body>
</html>
