<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все операции</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <style>
        .device-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .table-header {
            background: linear-gradient(135deg, #1d7acc, #1d7acc);
            color: white;
            padding: 1.5rem 2rem;
        }
        .table th {
            background-color: #f8f9fa;
            border-top: none;
            font-weight: 600;
            color: #495057;
            padding: 1rem;
        }
        .table td {
            padding: 1rem;
            vertical-align: middle;
        }
        .btn-complete {
            background: linear-gradient(135deg, #0b499b, #b7cce1);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-created {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #dee2e6;
        }
        .confirm-modal .modal-header {
            background: linear-gradient(135deg, #1d7acc, #1d7acc);
            color: white;
        }
        .device-sn {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #2c3e50;
        }
    </style>
</head>
<body>
<!-- Подключаем фрагменты -->
<div th:replace="fragments :: home-button"></div>
<div th:replace="~{fragments :: sidebar}"></div>
<div th:replace="~{fragments :: user-menu}"></div>

<div class="main-content">
    <!-- Шапка -->


    <!-- Основной контент -->
    <main class="page-content">
        <div class="container-fluid">
            <!-- Карточка с таблицей -->
            <div class="device-table" th:if="${not operations.empty}">
                <div class="table-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1">Все операции</h4>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Серийный номер</th>
                            <th>Описание</th>
                            <th>Операции</th>
                            <th>Дата операции</th>
                            <th>Фамилия</th>
                        </tr>
                        </thead>
                        <tbody>

                        <tr th:each="operation : ${operations}">
                            <td>
                                <span class="device-sn" th:text="${operation.serialNumber}"></span>
                            </td>
                            <td>
                                        <span th:if="${operation.description}"
                                              th:text="${#strings.abbreviate(operation.description, 50)}"
                                              data-bs-toggle="tooltip"
                                              th:attr="data-bs-title=${operation.description}">
                                        </span>
                                <span th:unless="${operation.description}" class="text-muted">—</span>
                            </td>
                            <td>
                                <span class="device-sn" th:text="${operation.getStatus().description}"></span>
                            </td>

                            <td>
                                        <span th:text="${#temporals.format(operation.createdTime, 'dd.MM.yyyy HH:mm')}">
                                        </span>
                            </td>
                            <td>
                                <span class="device-sn" th:text="${operation.account.lastName}"></span>
                            </td>

                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments :: scripts}"></div>



<script>

</script>
</body>
</html>
