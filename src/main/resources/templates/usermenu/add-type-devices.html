<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить новый тип</title>
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .home-button {
            position: fixed !important;
            bottom: 30px !important;
            right: 30px !important;
            width: 60px !important;
            height: 60px !important;
            border-radius: 50% !important;
            background-color: #1E40AF !important;
            color: white !important;
            border: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 24px !important;
            cursor: pointer !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
            z-index: 1000 !important;
            transition: all 0.3s ease !important;
        }

        .home-button:hover {
            background-color: #1e3a8a !important;
            transform: scale(1.1) !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25) !important;
        }

        .home-button:active {
            transform: scale(0.95) !important;
        }
        .accounts-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header h2 {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .accounts-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 1.5rem 2rem;
        }

        .table-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .search-box {
            position: relative;
            max-width: 300px;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .search-box input {
            padding-left: 2.5rem;
            border-radius: 20px;
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-active {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .role-badge {
            background: #e9ecef;
            color: #495057;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 0.1rem;
            display: inline-block;
        }

        .action-buttons .btn {
            padding: 0.25rem 0.5rem;
            margin: 0 0.1rem;
        }

        @media (max-width: 768px) {
            .accounts-container {
                padding: 1rem;
            }

            .table-actions {
                flex-direction: column;
                gap: 1rem;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<button class="home-button" onclick="window.location.href='/'">
    <i class="fas fa-home"></i>
</button>


<!-- Основной контент -->
<div class="main-content">
    <div class="accounts-container">
        <div class="page-header">
            <h2><i class="fa-solid fa-bacon"></i>Добавление нового типа платы</h2>
        </div>

        <div class="accounts-table">
            <div class="table-header">
                <h4 class="mb-0"><i class="fas fa-table"></i> Таблица типов плат</h4>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Тип</th>
                        <th>Описание</th>
                        <th>Дата создания</th>
                        <th>Действие</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="subtype : ${subtypeList}">
                        <td>
                            <strong th:text="${subtype.name}"></strong>
                        </td>
                        <td>
                            <strong th:text="${subtype.description}"></strong>
                        </td>
                        <td th:text="${#temporals.format(subtype.createdAt, 'dd.MM.yyyy')}"></td>
                        <td class="action-buttons">
<!--                            <button class="btn btn-sm btn-outline-primary edit-btn"-->
<!--                                    th:data-subtype-id="${subtype.id}">-->
<!--                                <i class="fas fa-edit"></i>-->
<!--                            </button>-->
                            <button class="btn btn-sm btn-outline-danger delete-btn"
                                    th:data-subtype-id="${subtype.id}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="add-form-section" style="border-top: 1px solid #dee2e6;">
                <div class="form-header" style="background: #f8f9fa; color: #495057; padding: 1rem 2rem;">
                    <h5 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Добавить новый тип платы</h5>
                </div>
                <div class="form-body" style="padding: 1.5rem 2rem; background: white;">
                    <form id="addTypeForm" method="POST" th:action="@{/devicetype/edite/add}" class="row g-3 align-items-end">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="col-md-6">
                            <label for="typeName" class="form-label" style="font-weight: 600; color: #495057;">
                                <i class="fas fa-microchip me-1"></i>Тип платы
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="typeName"
                                   name="name"
                                   placeholder="Введите тип платы"
                                   style="border: 1px solid #dee2e6; border-radius: 6px;"
                                   required>
                            <div class="form-text" style="color: #6b7280;">
                            </div>
                        </div>

                        <div class="mb-3">
                        <label for="typeDescription" class="form-label" style="font-weight: 600; color: #495057;">
                                Описание типа платы
                            </label>
                            <textarea class="form-control"
                                      id="typeDescription"
                                      name="description"
                                      placeholder="Введите описание типа платы"
                                      style="border: 1px solid #dee2e6; border-radius: 6px; min-height: 100px; resize: vertical;"
                                      required></textarea>
                            <div class="form-text" style="color: #6b7280;">
                            </div>
                        </div>

                        <div class="col-md-4">
                            <button type="submit" class="btn w-100" style="background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600;">
                                <i class="fas fa-plus me-1"></i> Добавить тип
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<script>
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const accountId = this.getAttribute('data-subtype-id');
            editAccount(accountId);
        });
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const accountId = this.getAttribute('data-subtype-id');
            deleteAccount(accountId);
        });
    });

    function deleteAccount(accountId) {
        if (confirm('Вы уверены, что хотите удалить этот тип?')) {

            fetch('/devicetype/edite/delete/' + accountId, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
                }
            })
                .then(response => {
                    console.log('Status:', response.status);
                    console.log('OK:', response.ok);
                    console.log('Headers:', response.headers);

                    location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Ошибка при удалении типа');
                });
        }
    }
</script>
</body>
</html>
