<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунты - LabManufacture</title>
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .home-button {
            position: fixed !important;
            bottom: 30px !important;
            right: 30px !important;
            width: 60px !important;
            height: 60px !important;
            border-radius: 50% !important;
            background-color: #1E40AF !important;
            color: white !important;
            border: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 24px !important;
            cursor: pointer !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
            z-index: 1000 !important;
            transition: all 0.3s ease !important;
        }

        .home-button:hover {
            background-color: #1e3a8a !important;
            transform: scale(1.1) !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25) !important;
        }

        .home-button:active {
            transform: scale(0.95) !important;
        }
        .accounts-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header h2 {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .accounts-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 1.5rem 2rem;
        }

        .table-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .search-box {
            position: relative;
            max-width: 300px;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .search-box input {
            padding-left: 2.5rem;
            border-radius: 20px;
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-active {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .role-badge {
            background: #e9ecef;
            color: #495057;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 0.1rem;
            display: inline-block;
        }

        .action-buttons .btn {
            padding: 0.25rem 0.5rem;
            margin: 0 0.1rem;
        }

        @media (max-width: 768px) {
            .accounts-container {
                padding: 1rem;
            }

            .table-actions {
                flex-direction: column;
                gap: 1rem;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<button class="home-button" onclick="window.location.href='/'">
    <i class="fas fa-home"></i>
</button>
<!-- Основной контент -->
<div class="main-content">
    <div class="accounts-container">
        <div class="page-header">
            <h2><i class="fas fa-users"></i> Управление аккаунтами</h2>
            <p>Список всех пользователей системы</p>
        </div>

        <div class="accounts-table">
            <div class="table-header">
                <h4 class="mb-0"><i class="fas fa-table"></i> Таблица аккаунтов</h4>
            </div>

            <div class="table-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" class="form-control" placeholder="Поиск пользователей..." id="searchInput">
                </div>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Имя пользователя</th>
                        <th>ФИО</th>
                        <th>Email</th>
                        <th>Роли</th>
                        <th>Дата создания</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="account : ${accounts}">
                        <td>
                            <strong th:text="${account.username}"></strong>
                        </td>
                        <td>
                            <span th:text="${account.lastName + ' ' + account.firstName + ' ' + (account.middleName != null ? account.middleName : '')}"></span>
                        </td>
                        <td th:text="${account.email}"></td>
                        <td>
                            <div th:each="role : ${account.roles}">
                                <span class="role-badge" th:text="${role.description}"></span>
                            </div>
                        </td>

                        <td th:text="${#temporals.format(account.createdAt, 'dd.MM.yyyy')}"></td>

                        <td class="action-buttons">
                            <button class="btn btn-sm btn-outline-primary edit-btn"
                                    th:data-account-id="${account.id}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger delete-btn"
                                    th:data-account-id="${account.id}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>


                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    // Поиск по таблице
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('tbody tr');

        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(searchTerm) ? '' : 'none';
        });
    });

    // Обработчики для кнопок редактирования
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const accountId = this.getAttribute('data-account-id');
            editAccount(accountId);
        });
    });

    // Обработчики для кнопок удаления
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const accountId = this.getAttribute('data-account-id');
            deleteAccount(accountId);
        });
    });


    function editAccount(accountId) {
        window.location.href = '/editing-user/' + accountId;
    }

    function deleteAccount(accountId) {
        if (confirm('Вы уверены, что хотите удалить этот аккаунт?')) {
            fetch('/delete/account/' + accountId, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
                }
            })
                .then(response => {
                    console.log('Status:', response.status);
                    console.log('OK:', response.ok);
                    console.log('Headers:', response.headers);

                    location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Ошибка при удалении типа');
                });
        }
    }
</script>
</body>
</html>
