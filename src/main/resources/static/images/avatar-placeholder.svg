<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="20" fill="#1E40AF"/>
    <text x="20" y="24" text-anchor="middle" fill="white" font-size="16" font-family="Arial, sans-serif">
        <tspan th:text="${currentUser.firstName != null ? currentUser.firstName.substring(0,1) : 'U'}"></tspan>
        <tspan th:text="${currentUser.lastName != null ? currentUser.lastName.substring(0,1) : 'S'}"></tspan>
    </text>
</svg>
