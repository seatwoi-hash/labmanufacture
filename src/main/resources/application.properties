spring.application.name=${SPRING_APPLICATION_NAME:labManufacture}

server.servlet.session.timeout=10h

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/labDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123!@}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}

spring.mvc.hiddenmethod.filter.enabled=true

server.port=80
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:220MB}

nextcloud.username=admin
nextcloud.password=admin123!@
nextcloud.webdav-path=/remote.php/dav/files/admin/
nextcloud.shares.default-expiration-days=1000000000
#nextcloud.server-url=http://nextcloud:80
#nextcloud.public-url=http://192.168.37.125:30540
nextcloud.public-url=http://localhost:30540
nextcloud.server-url=http://localhost:30540

spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=200
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=async-task-


management.metrics.tags.application=labManufacture
management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=always

# Logging
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.ru.polymetal.labManufacture=${APPLICATION_LOG_LEVEL:INFO}
logging.level.ru.polymetal.labManufacture.controller=${CONTROLLER_LOG_LEVEL:DEBUG}
logging.level.ru.polymetal.labManufacture.service=${SERVICE_LOG_LEVEL:DEBUG}
logging.level.ru.polymetal.labManufacture.scheduler=${SCHEDULER_LOG_LEVEL:DEBUG}
logging.level.ru.polymetal.labManufacture.config.logging=${REQUEST_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}
logging.slow-request-threshold-ms=${SLOW_REQUEST_THRESHOLD_MS:1000}
logging.file.name=${LOG_FILE:logs/lab-manufacture.log}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:50MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}
logging.logback.rollingpolicy.clean-history-on-start=${LOG_CLEAN_HISTORY_ON_START:false}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-system}] %logger - %msg%n
